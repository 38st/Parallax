name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parallax-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_VERSION: 0.1.0
  CI_BUNDLE_ID: com.parallax.Parallax
  CI_MINIMUM_SYSTEM_VERSION: "14.0"
  DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

jobs:
  build-and-test:
    name: Warning-clean release build and test
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record toolchain
        run: |
          swift --version
          swift --version | grep -E '^Apple Swift version 6\.'
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Build release with warnings as errors
        run: swift build -c release --jobs 4 -Xswiftc -warnings-as-errors

      - name: Prove warnings-as-errors rejects a deliberate warning
        run: ./script/test_warning_gate.sh

      - name: Test CI evidence hygiene contracts
        run: ./script/test_ci_evidence_hygiene.sh

      - name: Test with warnings as errors
        run: swift test --jobs 4 -Xswiftc -warnings-as-errors

      - name: Test localization completeness contract
        run: python3 script/test_localization_completeness.py

      - name: Enforce localization completeness
        run: python3 script/check_localization_completeness.py

      - name: Test packaging command contract
        run: ./script/test_build_and_run.sh

  secret-scan:
    name: Pinned redacted secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install checksum-pinned gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-8.30.1"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" gitleaks
          "$install_dir/gitleaks" version

      - name: Scan source with a redacted retained report
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks-8.30.1/gitleaks
          EXPECTED_GITLEAKS_VERSION: 8.30.1
          SECRET_SCAN_OUTPUT_DIR: ${{ runner.temp }}/parallax-secret-scan
        run: ./script/run_secret_scan.sh

      - name: Upload redacted secret-scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Parallax-secret-scan-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/parallax-secret-scan/gitleaks-report.json
            ${{ runner.temp }}/parallax-secret-scan/gitleaks-metadata.txt
            ${{ runner.temp }}/parallax-secret-scan/gitleaks.stdout
            ${{ runner.temp }}/parallax-secret-scan/gitleaks.stderr
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Product-only coverage ratchet
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record exact toolchain
        run: |
          swift --version
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun llvm-cov --version

      - name: Test coverage-ratchet contract
        run: ./script/test_coverage_gate.sh

      - name: Measure and ratchet product-only coverage
        env:
          COVERAGE_JOBS: 4
          COVERAGE_OUTPUT_DIR: ${{ runner.temp }}/parallax-coverage
          COVERAGE_SCRATCH_PATH: ${{ runner.temp }}/parallax-coverage-build
        run: ./script/check_coverage.sh

      - name: Upload product coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Parallax-product-coverage-${{ github.run_number }}
          path: ${{ runner.temp }}/parallax-coverage
          if-no-files-found: warn
          retention-days: 14

  address-sanitizer:
    name: Address Sanitizer
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ASan test lane
        env:
          SANITIZER_JOBS: 4
          SANITIZER_SCRATCH_PATH: ${{ runner.temp }}/parallax-asan-build
        run: ./script/run_sanitizer_tests.sh address "$RUNNER_TEMP/parallax-asan"

      - name: Upload ASan reports and exact toolchain
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Parallax-asan-${{ github.run_number }}
          path: ${{ runner.temp }}/parallax-asan
          if-no-files-found: warn
          retention-days: 14

  thread-sanitizer:
    name: Thread Sanitizer
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run TSan test lane
        env:
          SANITIZER_JOBS: 4
          SANITIZER_SCRATCH_PATH: ${{ runner.temp }}/parallax-tsan-build
        run: ./script/run_sanitizer_tests.sh thread "$RUNNER_TEMP/parallax-tsan"

      - name: Upload TSan reports and exact toolchain
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Parallax-tsan-${{ github.run_number }}
          path: ${{ runner.temp }}/parallax-tsan
          if-no-files-found: warn
          retention-days: 14

  production-keychain:
    name: Required production Keychain characterization
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run fail-closed production Keychain CRUD characterization
        shell: bash
        env:
          PARALLAX_REQUIRE_PRODUCTION_KEYCHAIN_TESTS: 1
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/parallax-keychain"
          mkdir -p "$output_dir"
          rm -f \
            "$output_dir/test.log" "$output_dir/status.txt" \
            "$output_dir/toolchain.txt"
          printf 'status=pending\n' >"$output_dir/status.txt"
          {
            swift --version
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
          } >"$output_dir/toolchain.txt"

          set +e
          swift test \
            --scratch-path "$RUNNER_TEMP/parallax-keychain-build" \
            --filter ProductionKeychainCRUDCharacterizationTests \
            -Xswiftc -warnings-as-errors \
            2>&1 | tee "$output_dir/test.log"
          pipeline_status=("${PIPESTATUS[@]}")
          test_status="${pipeline_status[0]}"
          tee_status="${pipeline_status[1]}"
          set -e
          {
            echo "status=$([[ "$test_status" -eq 0 && "$tee_status" -eq 0 ]] && echo pass || echo fail)"
            echo "swift_test_exit_status=$test_status"
            echo "tee_exit_status=$tee_status"
          } >"$output_dir/status.txt"
          [[ "$test_status" -eq 0 ]] || exit "$test_status"
          exit "$tee_status"

      - name: Upload production Keychain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Parallax-production-keychain-${{ github.run_number }}
          path: ${{ runner.temp }}/parallax-keychain
          if-no-files-found: warn
          retention-days: 14

  quality-gate:
    name: Required quality gates
    if: ${{ always() }}
    needs:
      - build-and-test
      - secret-scan
      - coverage
      - address-sanitizer
      - thread-sanitizer
      - production-keychain
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every quality lane to pass
        env:
          QUALITY_GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          required = {
              "build-and-test",
              "secret-scan",
              "coverage",
              "address-sanitizer",
              "thread-sanitizer",
              "production-keychain",
          }
          results = json.loads(os.environ["QUALITY_GATE_RESULTS"])
          missing = sorted(required - results.keys())
          failed = sorted(
              name
              for name in required
              if results.get(name, {}).get("result") != "success"
          )
          if missing or failed:
              if missing:
                  print(
                      "::error::Required quality jobs are missing: "
                      + ", ".join(missing)
                  )
              if failed:
                  details = ", ".join(
                      f"{name}={results.get(name, {}).get('result', 'missing')}"
                      for name in failed
                  )
                  print("::error::Required quality jobs did not pass: " + details)
              sys.exit(1)
          print("All required quality jobs passed.")
          PY

  unsigned-release:
    name: Unsigned universal release
    needs: quality-gate
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble unsigned release artifacts
        env:
          VERSION: ${{ env.CI_VERSION }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUNDLE_ID: ${{ env.CI_BUNDLE_ID }}
          MIN_SYSTEM_VERSION: ${{ env.CI_MINIMUM_SYSTEM_VERSION }}
          DIST_DIR: ${{ runner.temp }}/parallax-dist
        run: |
          ./script/build_and_run.sh archive \
            --version "$VERSION" \
            --build "$BUILD_NUMBER" \
            --dist "$DIST_DIR" \
            --architecture universal \
            --zip \
            --dmg

      - name: Verify published artifacts without rebuilding
        env:
          DIST_DIR: ${{ runner.temp }}/parallax-dist
        run: |
          ./script/build_and_run.sh verify \
            --artifact "$DIST_DIR/Parallax-$CI_VERSION-$GITHUB_RUN_NUMBER.zip" \
            --expect unsigned \
            --architecture universal
          ./script/build_and_run.sh verify \
            --artifact "$DIST_DIR/Parallax-$CI_VERSION-$GITHUB_RUN_NUMBER.dmg" \
            --expect unsigned \
            --architecture universal

      - name: Inspect plist, architectures, deployment target, and resources
        shell: bash
        env:
          DIST_DIR: ${{ runner.temp }}/parallax-dist
        run: |
          set -euo pipefail
          inspection_dir="$RUNNER_TEMP/parallax-assembly-inspection"
          mkdir -p "$inspection_dir"
          ditto -x -k \
            "$DIST_DIR/Parallax-$CI_VERSION-$GITHUB_RUN_NUMBER.zip" \
            "$inspection_dir"

          app="$inspection_dir/Parallax.app"
          plist="$app/Contents/Info.plist"
          executable="$app/Contents/MacOS/Parallax"

          test -d "$app"
          test -x "$executable"
          test -d "$app/Contents/Resources"
          plutil -lint "$plist"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = "$CI_BUNDLE_ID"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" = "$CI_VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$plist")" = "$GITHUB_RUN_NUMBER"
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$plist")" = "$CI_MINIMUM_SYSTEM_VERSION"

          architectures=" $(lipo -archs "$executable") "
          [[ "$architectures" == *" arm64 "* ]]
          [[ "$architectures" == *" x86_64 "* ]]

          deployment_targets="$(
            xcrun vtool -show-build "$executable" |
              awk '$1 == "minos" { print $2 }' |
              sort -u
          )"
          test "$deployment_targets" = "$CI_MINIMUM_SYSTEM_VERSION"

          resource_bundle="$app/Contents/Resources/Parallax_Parallax.bundle"
          test -d "$resource_bundle"
          test -f "$resource_bundle/AppIcon.icns"
          test -f "$app/Contents/Resources/AppIcon.icns"

          provenance="$DIST_DIR/Parallax-$CI_VERSION-$GITHUB_RUN_NUMBER.provenance.plist"
          plutil -lint "$provenance"
          test "$(
            plutil -extract PackagedBinarySHA256 raw -o - "$provenance"
          )" = "$(shasum -a 256 "$executable" | awk '{print $1}')"
          test "$(
            plutil -extract ZIPSHA256 raw -o - "$provenance"
          )" = "$(
            shasum -a 256 \
              "$DIST_DIR/Parallax-$CI_VERSION-$GITHUB_RUN_NUMBER.zip" |
              awk '{print $1}'
          )"
          test "$(
            plutil -extract DMGSHA256 raw -o - "$provenance"
          )" = "$(
            shasum -a 256 \
              "$DIST_DIR/Parallax-$CI_VERSION-$GITHUB_RUN_NUMBER.dmg" |
              awk '{print $1}'
          )"

      - name: Upload verified unsigned artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Parallax-unsigned-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/parallax-dist/Parallax-${{ env.CI_VERSION }}-${{ github.run_number }}.zip
            ${{ runner.temp }}/parallax-dist/Parallax-${{ env.CI_VERSION }}-${{ github.run_number }}.dmg
            ${{ runner.temp }}/parallax-dist/Parallax-${{ env.CI_VERSION }}-${{ github.run_number }}.provenance.plist
          if-no-files-found: error
          retention-days: 7

  clean-artifact-inspection:
    name: Clean ZIP and DMG inspection
    needs: unsigned-release
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download unsigned artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Parallax-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/parallax-artifacts

      - name: Confirm clean runtime environment
        run: test ! -e .build

      - name: Extract and inspect ZIP
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/parallax-artifacts
          EXTRACT_DIR: ${{ runner.temp }}/parallax-extracted
        run: |
          set -euo pipefail
          zip_path="$ARTIFACT_DIR/Parallax-$CI_VERSION-$GITHUB_RUN_NUMBER.zip"
          zip_extract="$EXTRACT_DIR/zip"
          mkdir -p "$zip_extract"
          ./script/build_and_run.sh verify \
            --artifact "$zip_path" \
            --expect unsigned \
            --architecture universal
          ditto -x -k "$zip_path" "$zip_extract"

          test -d "$zip_extract/Parallax.app"
          ./script/build_and_run.sh verify \
            --artifact "$zip_extract/Parallax.app" \
            --expect unsigned \
            --architecture universal
          test ! -e .build

          zip_home="$RUNNER_TEMP/parallax-zip-smoke-home"
          mkdir -p "$zip_home"
          output="$(
            HOME="$zip_home" \
              CFFIXED_USER_HOME="$zip_home" \
              "$zip_extract/Parallax.app/Contents/MacOS/Parallax" \
                --resource-smoke-test
          )"
          grep -F "Parallax packaged resources: OK" <<<"$output"
          provenance="$ARTIFACT_DIR/Parallax-$CI_VERSION-$GITHUB_RUN_NUMBER.provenance.plist"
          test "$(
            plutil -extract PackagedBinarySHA256 raw -o - "$provenance"
          )" = "$(
            shasum -a 256 \
              "$zip_extract/Parallax.app/Contents/MacOS/Parallax" |
              awk '{print $1}'
          )"

      - name: Extract and inspect DMG
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/parallax-artifacts
          EXTRACT_DIR: ${{ runner.temp }}/parallax-extracted
        run: |
          set -euo pipefail
          dmg_path="$ARTIFACT_DIR/Parallax-$CI_VERSION-$GITHUB_RUN_NUMBER.dmg"
          mount_point="$RUNNER_TEMP/parallax-dmg-mount"
          dmg_extract="$EXTRACT_DIR/dmg"
          mkdir -p "$mount_point" "$dmg_extract"

          cleanup() {
            hdiutil detach "$mount_point" -force >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ./script/build_and_run.sh verify \
            --artifact "$dmg_path" \
            --expect unsigned \
            --architecture universal
          hdiutil attach \
            "$dmg_path" \
            -nobrowse \
            -readonly \
            -mountpoint "$mount_point"
          test -d "$mount_point/Parallax.app"
          ditto "$mount_point/Parallax.app" "$dmg_extract/Parallax.app"
          hdiutil detach "$mount_point"
          trap - EXIT

          ./script/build_and_run.sh verify \
            --artifact "$dmg_extract/Parallax.app" \
            --expect unsigned \
            --architecture universal
          test ! -e .build

          dmg_home="$RUNNER_TEMP/parallax-dmg-smoke-home"
          mkdir -p "$dmg_home"
          output="$(
            HOME="$dmg_home" \
              CFFIXED_USER_HOME="$dmg_home" \
              "$dmg_extract/Parallax.app/Contents/MacOS/Parallax" \
                --resource-smoke-test
          )"
          grep -F "Parallax packaged resources: OK" <<<"$output"
          provenance="$ARTIFACT_DIR/Parallax-$CI_VERSION-$GITHUB_RUN_NUMBER.provenance.plist"
          test "$(
            plutil -extract PackagedBinarySHA256 raw -o - "$provenance"
          )" = "$(
            shasum -a 256 \
              "$dmg_extract/Parallax.app/Contents/MacOS/Parallax" |
              awk '{print $1}'
          )"

  signed-notarized-release:
    name: Manual credentialed signed and notarized verification
    if: github.event_name == 'workflow_dispatch'
    needs:
      - quality-gate
      - clean-artifact-inspection
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check signed-release credentials
        id: credentials
        shell: bash
        env:
          SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[
            -z "$SIGNING_CERTIFICATE_P12_BASE64" ||
            -z "$SIGNING_CERTIFICATE_PASSWORD" ||
            -z "$SIGN_IDENTITY" ||
            -z "$APPLE_NOTARY_APPLE_ID" ||
            -z "$APPLE_NOTARY_TEAM_ID" ||
            -z "$APPLE_NOTARY_PASSWORD"
          ]]; then
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "::error::Manual signed/notarized verification cannot run because release credentials are incomplete."
            exit 1
          else
            echo "available=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Check out source
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and verify signed notarized release
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        env:
          VERSION: ${{ env.CI_VERSION }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUNDLE_ID: ${{ env.CI_BUNDLE_ID }}
          MIN_SYSTEM_VERSION: ${{ env.CI_MINIMUM_SYSTEM_VERSION }}
          SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          DIST_DIR: ${{ runner.temp }}/parallax-signed-dist
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/parallax-developer-id.p12"
          keychain_path="$RUNNER_TEMP/parallax-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          notary_profile="parallax-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            security default-keychain -d user -s login.keychain-db \
              >/dev/null 2>&1 || true
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$certificate_path"
          }
          trap cleanup EXIT

          printf '%s' "$SIGNING_CERTIFICATE_P12_BASE64" |
            /usr/bin/base64 -D >"$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          xcrun notarytool store-credentials "$notary_profile" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --team-id "$APPLE_NOTARY_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --keychain "$keychain_path"

          ./script/build_and_run.sh release \
            --version "$VERSION" \
            --build "$BUILD_NUMBER" \
            --dist "$DIST_DIR" \
            --architecture universal \
            --sign "$SIGN_IDENTITY" \
            --notarize \
            --staple \
            --notary-profile "$notary_profile" \
            --zip \
            --dmg

          ./script/build_and_run.sh verify \
            --artifact "$DIST_DIR/Parallax-$VERSION-$BUILD_NUMBER.zip" \
            --expect signed \
            --architecture universal \
            --team-id "$APPLE_NOTARY_TEAM_ID" \
            --bundle-id "$BUNDLE_ID" \
            --notarized
          ./script/build_and_run.sh verify \
            --artifact "$DIST_DIR/Parallax-$VERSION-$BUILD_NUMBER.dmg" \
            --expect signed \
            --architecture universal \
            --team-id "$APPLE_NOTARY_TEAM_ID" \
            --bundle-id "$BUNDLE_ID" \
            --notarized
