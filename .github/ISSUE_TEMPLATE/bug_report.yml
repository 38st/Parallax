name: Bug report
description: Report a reproducible problem in Parallax
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove personal paths, profile names, environment values, account details, and other sensitive data. Report vulnerabilities through the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Parallax version
      description: Release version or commit SHA
      placeholder: 0.1.0 or abc1234
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 14.6.1
    validations:
      required: true
  - type: input
    id: application
    attributes:
      label: Launched application
      description: Application name and version, if relevant
      placeholder: Chromium 126
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic names, paths, arguments, and environment values.
      placeholder: |
        1. Add an application…
        2. Create a profile…
        3. Select…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Additional context
      description: Add redacted logs or screenshots if they help.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials, personal data, and sensitive paths.
          required: true
        - label: This is not a security vulnerability.
          required: true
