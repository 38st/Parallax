name: ParallaxMobile
options:
  bundleIdPrefix: com.parallax
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  ParallaxMobile:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parallax.mobile
        INFOPLIST_KEY_CFBundleDisplayName: Parallax
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSCameraUsageDescription: Parallax uses the camera only when a website you open requests it.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Parallax uses the microphone only when a website you open requests it.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Parallax accesses your photo library only when you choose a file for a website.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - ParallaxMobileTests
  ParallaxMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: ParallaxMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parallax.mobile.tests
